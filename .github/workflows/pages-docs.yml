name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for git describe to see tags

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - name: Add mdbook-variables
        run: cargo install mdbook-variables

      - name: Add mdbook-cmdrun
        run: cargo install --git https://github.com/roberth/mdbook-cmdrun --branch mdbook-0.5

      - name: Add mdbook-mermaid-mmdr
        run: cargo install --git https://github.com/adamcavendish/mdbook-mermaid-mmdr

      - name: Build docs
        run: |
          cd docs
          RELEASE_VERSION="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          MDBOOK_PREPROCESSOR__VARIABLES__VARIABLES__RELEASE="$RELEASE_VERSION" mdbook build

      - name: Deploy docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          destination_dir: docs
          keep_files: true
