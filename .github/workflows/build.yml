name: Build Wails App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
            VERSION=${VERSION#v}
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "dev")
          fi

          if [ -n "$(git status --porcelain)" ]; then
            COMMIT=$(git rev-parse --short HEAD)
            VERSION="${VERSION}-${COMMIT}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build
        run: wails3 build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Rewyt-${{ steps.version.outputs.version }}-linux-x86_64.zip
          path: bin/

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}" -replace '^v'
          } else {
            try {
              $VERSION = (git describe --tags --abbrev=0 2>$null) -replace '^v'
            } catch {
              $VERSION = "dev"
            }
          }

          $dirty = git status --porcelain
          if ($dirty) {
            $COMMIT = (git rev-parse --short HEAD)
            $VERSION = "$VERSION-$COMMIT"
          }

          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Verify installation
        run: wails3 doctor

      - name: Build
        run: wails3 build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Rewyt-${{ steps.version.outputs.version }}-windows-x86_64.zip
          path: bin/
