name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: wails3 build

      - name: Package build
        run: |
          cd bin
          zip -r ../Rewyt-${{ steps.version.outputs.version }}-linux_x64.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Rewyt-${{ steps.version.outputs.version }}-linux_x64.zip
          path: Rewyt-${{ steps.version.outputs.version }}-linux_x64.zip

  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: wails3 build

      - name: Package build
        run: |
          cd bin
          zip -r ../Rewyt-${{ steps.version.outputs.version }}-macos_universal.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Rewyt-${{ steps.version.outputs.version }}-macos_universal.zip
          path: Rewyt-${{ steps.version.outputs.version }}-macos_universal.zip

  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}" -replace '^v'
          "version=$VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build
        run: wails3 build

      - name: Package build
        shell: pwsh
        run: |
          Compress-Archive -Path bin\* -DestinationPath Rewyt-${{ steps.version.outputs.version }}-windows_x64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Rewyt-${{ steps.version.outputs.version }}-windows_x64.zip
          path: Rewyt-${{ steps.version.outputs.version }}-windows_x64.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Wait for tag to propagate
        run: sleep 10

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
