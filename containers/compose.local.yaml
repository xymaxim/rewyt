services:
  pot-provider:
    image: docker.io/brainicism/bgutil-ytdlp-pot-provider:deno
    container_name: pot-provider
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4416'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  rewyt:
    build:
      context: .
      dockerfile: Containerfile
    container_name: rewyt
    restart: unless-stopped
    ports:
      - "8080:3000" # Rewyt web app
      - "9000:9000" # ypb CLI, invoked manually by users (reserved) 
      - "9001:9001" # ypb server, auto-started by Rewyt on startup
    volumes:
      - ${YPB_YTDLP_CONFIG_LOCATION:-config}:/root/.config/yt-dlp:z
      - ${YPB_MEDIA_DIR:-./media}:/media:z
    depends_on:
      pot-provider:
        condition: service_healthy

volumes:
  config:
