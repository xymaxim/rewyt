services:
  pot-provider:
    image: docker.io/brainicism/bgutil-ytdlp-pot-provider:deno
    container_name: pot-provider
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4416'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: app
    restart: unless-stopped
    ports:
      - "8080:3000"
      - "9000:9000"
    volumes:
      - ${YTDLP_CONFIG_DIR:-/dev/null}:/root/.config/yt-dlp:z
    depends_on:
      pot-provider:
        condition: service_healthy
